  # --- Framework refactoring (2026-03-29) ---
  - what: "Framework refactoring: extract lib/, deduplicate templates, consolidate tests"
    why: "prawduct-setup.py was 2000+ lines in one file, templates had duplicated content
      across skill files and templates/, and 813 tests across 13 files included significant
      overlap. 7-chunk refactoring: (0) product compat test suite as safety net, (1) dead
      code + duplicate template deletion, (2) mechanical extraction to tools/lib/ (core,
      init, migrate, sync, validate), (3) DRY improvements within lib/ (unified helpers,
      compat aliases), (4) content deduplication (build-governance checklist, Critic role
      comments, agents/README, relocated speculative templates), (5) test consolidation
      (merged overlapping test files, collapsed single-assertion tests into behavioral
      groups), (6) cleanup, docs, deprecation warnings, V4_GITIGNORE fix, Critic changelog
      scope fix, gitignore hygiene (sync removes incorrectly-gitignored managed
      files and advises user to git-add; validate detects the mismatch).
      Final: 655 tests across 11 files, all passing."
    blast_radius: "New: tools/lib/ (5 modules), agents/README.md, docs/examples/,
      tests/test_product_compat.py. Deleted: templates/skill-janitor.md,
      templates/skill-learnings.md, templates/skill-pr.md, templates/skill-prawduct-doctor.md,
      templates/examples/, tests/test_v5_hooks.py, tests/test_v5_migration.py. Archived:
      .prawduct/working-notes/ → .prawduct/archive/working-notes/. Modified: tools/prawduct-setup.py
      (thin CLI), all templates, all test files, README.md, docs/project-structure.md,
      agents/critic/SKILL.md, templates/critic-review.md."
    classification: structural
    date: 2026-03-29
  # --- Unified prawduct-setup.py + /prawduct-setup skill (2026-03-22) ---
  - what: "Consolidate prawduct-init.py, prawduct-migrate.py, prawduct-sync.py into unified prawduct-setup.py"
    why: "Three scripts with importlib cross-imports, a 6-step prose detection algorithm in CLAUDE.md,
      no post-setup validation, and no health check tool. Unified into one script with subcommands
      (setup, sync, validate). Added /prawduct-setup skill for onboarding and health checks.
      Old scripts replaced with import-safe backward-compat shims."
    blast_radius: "New: tools/prawduct-setup.py (~2000 lines), templates/skill-prawduct-setup.md,
      .claude/skills/prawduct-setup/SKILL.md, tests/test_prawduct_validate.py (27 tests).
      Replaced with shims: tools/prawduct-init.py, tools/prawduct-migrate.py, tools/prawduct-sync.py.
      Modified: tools/product-hook (try_sync prefers new script), CLAUDE.md (simplified onboarding),
      README.md (commands + product structure), docs/project-structure.md (file listing),
      8 test files (import paths), tests/scenarios/*.md (command references). 725 total tests."
    classification: structural
    date: 2026-03-22
  # --- SessionEnd sync + Critic no-test-execution (2026-03-22) ---
  - what: "Add SessionEnd hook for framework sync; sharpen Critic to not run tests"
    why: "Users needed two restarts to pick up framework updates (sync ran after Claude Code
      loaded settings). SessionEnd sync writes hot files before next session loads them.
      Critic was running the test suite (up to 4x with coordinator subagents), duplicating
      work the builder already does. Reframed Goal 1 as code-analysis review of test quality."
    blast_radius: "Modified: tools/product-hook (cmd_session_end, quiet sync, removed restart
      messages), tools/prawduct-sync.py (removed restart notes), templates/product-settings.json
      and .claude/settings.json (SessionEnd hook), agents/critic/SKILL.md and review-cycle.md
      and templates/critic-review.md (Goal 1 rewrite, coordinator dispatch), methodology/building.md
      (Goal 1 summary, token budget trim), README.md (sync description). Tests: 4 new session-end,
      698 total."
  # --- Critic Goal 7, security, coordinator pattern (2026-03-19) ---
  - what: 'Critic restructure: Goal 7 (Design Quality), security checks, coordinator pattern'
    why: 'Gap analysis revealed that after clearing all Critic findings, manual review still found
      issues in encapsulation, coupling, simplification, security, and doc drift. The 6 goals
      covered correctness/completeness/scope/coherence/rationale/observability but not design
      quality or security. Added Goal 7 "The Design Is Sound" (encapsulation, coupling,
      simplification, deduplication). Added security checks to Goal 1 (injection, secrets, input
      validation as BLOCKING; auth, CVEs as WARNING). Strengthened Goal 4: project-preferences
      compliance promoted to BLOCKING, README active checking added, documentation drift expanded,
      historical records (changelogs) marked immutable. Severity recalibration: NOTE now means
      "genuinely ambiguous — builder decides" instead of "minor suggestion." Coordinator pattern
      for medium/large reviews: spawn 3 parallel subagents (correctness, design, sustainability).
      670 total tests (20 new).'
    blast_radius: 'Modified: agents/critic/SKILL.md (Goal 7, security, doc drift, coordinator,
      severity), templates/critic-review.md (same, condensed), agents/critic/framework-checks.md
      (voice inconsistency NOTE→WARNING), methodology/building.md (7-goal summary, coordinator,
      severity), .prawduct/cross-cutting-concerns.md (Security→Goal 1), README.md (manual sync
      instructions). Tests: test_v5_methodology.py (6 new), test_v5_templates.py (6 new),
      test_prawduct_init.py (1 updated).'
    classification: functional
    date: 2026-03-19
  # --- Sync --force flag and message improvements (2026-03-19) ---
  - what: 'Sync skip messages clarified, --force flag added'
    why: 'Running prawduct-sync.py produced misleading messages when local edits conflicted with
      updated templates. The critic-review.md message said "template updated, restart to see
      changes" when the file was actually skipped. Improved both template and block_template
      strategy messages to clearly state the conflict and suggest --force. Added --force CLI flag
      to overwrite locally-edited files with new template versions. 66 sync tests (6 new).'
    blast_radius: 'Modified: tools/prawduct-sync.py (messages, --force flag), tests/test_prawduct_sync.py
      (6 new tests for force and message wording).'
    classification: functional
    date: 2026-03-19
  # --- PR reviewer fixes (2026-03-18) ---
  - what: 'Fix PR reviewer evidence filename and invocation'
    why: 'PR reviewer was computing the evidence filename internally, but the caller also needed
      the path to check for evidence. Fixed so caller computes path and passes it to reviewer.'
    blast_radius: 'Modified: agents/pr-reviewer/SKILL.md, .claude/commands/pr.md'
    classification: bugfix
    date: 2026-03-18
  # --- v6: session discipline & quality hardening (2026-03-17) ---
  - what: 'v6: Session discipline & quality hardening'
    why: 'Analysis of 50+ discodon build sessions + TangleClaw feedback revealed: no session
      definition, "pre-existing" escape hatch, plans lost on compaction, noisy broad-except
      canary, artifact drift from late updates, no session scope guidance, learnings briefing
      missed most formats, /clear escaped governance gates. 7-chunk implementation:
      (1) session/work-cycle definition, (2) eliminate pre-existing + extended baseline,
      (3) plan persistence + artifact updates during build, (4) broad-except pragma marking,
      (5) session scope + pre-chunk validation + parallel agents, (6) /clear governance
      warning + learnings briefing format, (7) tests + integration. 601 total tests (12 new).'
    blast_radius: 'Modified: methodology/building.md (session definition, extended baseline,
      plan persistence, artifact update timing, exception handling section, scope discipline,
      pre-chunk validation, parallel agents), methodology/reflection.md (work cycles, persistence
      check, reflections archive note), templates/product-claude.md (session/work-cycle,
      no-pre-existing, plan persistence, artifact updates, session scope), templates/critic-review.md
      (no-pre-existing, broad-except pragma), agents/critic/SKILL.md (no-pre-existing,
      broad-except pragma), docs/principles.md (Principle 21 no-pre-existing rationale),
      tools/product-hook (broad-except pragma detection, /clear governance warning, learnings
      briefing format), CLAUDE.md (session/work-cycle reference),
      tests/test_v5_hooks.py (12 new tests).'
    classification: structural
    date: 2026-03-17
  # --- v5: work-scaled governance (2026-03-09) ---
  - what: 'v5: Work-scaled governance replaces phase-based model'
    why: 'Phase-based governance (discovery→planning→building→reflection) was too rigid —
      hotfixes got full discovery, trivial changes got enterprise review. v5 scales governance
      by work size (trivial/small/medium/large) × type (feature/bugfix/refactor/optimization/debt/hotfix).
      6-chunk implementation: (1) goal-based Critic with 6 prioritized goals, (2) session briefing
      with staleness scan, (3) compliance canary checks, (4) governance scaling matrix in building.md,
      (5) migration + sync (v4→v5 auto-migration, learnings split, project-state migration),
      (6) framework docs + integration validation. 584 total tests (76 new unit + 29 integration).'
    blast_radius: 'Modified: agents/critic/SKILL.md, agents/critic/review-cycle.md,
      templates/critic-review.md, tools/product-hook (session briefing + compliance canary),
      methodology/building.md (governance scaling matrix), tools/prawduct-sync.py (v4→v5 migration),
      tools/prawduct-init.py (boundary-patterns, .subagent-briefing gitignore),
      tools/prawduct-migrate.py (v5 detection + migration path), templates/product-claude.md.
      New: tests/test_v5_migration.py (45), tests/test_integration_lifecycle.py (29),
      templates/boundary-patterns.md.'
    classification: structural
    date: 2026-03-09
  # Older entries (2026-03-03 and earlier — v1/v2/v3 archaeology) trimmed to keep this
  # file small; they predate change-log.md and live in git history only.

# =============================================================================
# BUILD STATE
# =============================================================================

build_state:
  source_root: "."

# =============================================================================
# DERIVED VIEWS (enabled by default, v1.4+)
# =============================================================================
# When true (default), the build-plan `## Status` block is a derived view of
# change-log.md tagged entries. Run `prawduct-hook regen-views`
# to apply. Prawduct dogfoods this — change-log v1.3.17/v1.3.16 entries carry
# tag lines so regen produces the correct Wave-1-complete Status state.

views_enabled: true

# Active build plan (optional). Names the in-progress plan file relative to
# `.prawduct/` so the build-plan tooling (regen-views, infer-critic-mode, the
# stop-hook gate) finds a scope-named plan instead of the conventional
# artifacts/build-plan.md. Unset → falls back to artifacts/build-plan.md.
#
# The history of pointer moves lives in .prawduct/change-log.md + git; this
# field holds only the current in-progress plan (absent/empty -> the gates
# fall back to artifacts/build-plan.md).

active_build_plan: artifacts/build-plan-discodon-upstream-defects.md

# =============================================================================
# COVERAGE EVIDENCE (opt-in, v1.4+)
# =============================================================================
# When true, the Critic requires every changed file to appear in
# `.test-evidence.json`'s `changes_referenced` list and scales severity
# language to the declared `coverage_level` (`referenced` floor vs.
# `executed` real). See `/prawduct:building` "Coverage Evidence" + the
# reference verifier at `bin/test-reference-verify`. Default off in
# v1.4 — schema is checked but content is not enforced (Chunk 09 ships
# the Critic check). The framework dogfoods the new evidence schema
# regardless (every chunk emits the new fields) so drift surfaces early.

coverage_required: false

# =============================================================================
# OPERATOR VERIFICATION (opt-in, v1.4+)
# =============================================================================
# When true, `/pr create` BLOCKS if `.prawduct/operator-verification.md`
# has any entry with `**Status:** pending`. The framework itself ships
# this gate disabled — Prawduct has no human-facing UI surface to
# verify pre-merge; product repos that ship visual changes opt in by
# setting `operator_verification_required: true`.

operator_verification_required: false

# =============================================================================
# API VERSIONING DECISION (advisory-probe resolution signal)
# =============================================================================
# Flat top-level mirror of design_decisions.api_versioning_approach — the
# api-versioning advisory probe reads only column-0 scalars, so this is its
# readable resolution signal. Truthy = a decision was recorded → suppress the
# nudge. See artifacts/api-contract.md for the full decision.

api_versioning_decided: "plugin-semver + evidence-schema-version; CLI internal, external-consumer versioning deferred (revisit: first non-prawduct caller of prawduct-hook)"

# =============================================================================
# NORM REGISTRY RATIFICATION (advisory-probe resolution signal)
# =============================================================================
# Flat top-level scalar the norm-registry-unratified probe reads (column-0
# scalar). Truthy = the owner ratified the norm registry -> suppress the nudge.
# The ratified norms live in `## Direction` sections across the strategy
# artifacts, indexed in artifacts/project-preferences.md section Enforcement.

norm_registry_ratified: "2026-07-17 — 20 Direction norms across the 7 strategy artifacts; preferences Enforcement index carries the norm columns (Audit home / Why)"

# =============================================================================
# DEPRECATED TERMS
# =============================================================================
# Track vocabulary changes to catch stale references.
# Only terms that could still appear in active files.

deprecated_terms:
  - term: "product shapes"
    replacement: "structural characteristics"
    patterns: ["product shape"]
  - term: "concern dimensions"
    replacement: "structural characteristics"
    patterns: ["concern dimension"]

