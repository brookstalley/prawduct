# building them (07 and 08 were deferred out of v3.2.0 and never re-cut), and pointing
# at a dormant plan is what produced all three stale-pointer incidents above. Next
# work comes from /prawduct:backlog pick, which sets this.
# Set 2026-08-03 on branch fix/silent-gates, doing exactly what the line above
# prescribes: /prawduct:backlog pick produced the roster, the owner chose the
# cluster, and the pointer now names the plan actually under build. This is the
