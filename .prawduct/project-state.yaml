# release-plan-v3.2.3.md. upgrade-discovery is complete; its plan is RETAINED
# rather than deleted only because the develop->main release regenerates Status
# for every release-pending plan.
# Repointed 2026-08-02 on branch fix/critic-death-signals: this branch builds
# the critic-death-signals plan; the golive plan continues on its own branch.
# Cleared 2026-08-02 at v3.2.3 Phase 1 step 11. The two previous releases recorded
# a departure here instead of clearing, on the ground that the pointer named a plan
# with unchecked chunks and clearing it would orphan work mid-flight. That ground is
# gone: the pointer names build-plan-critic-death-signals.md, whose only chunk flipped
