active_build_plan: artifacts/build-plan-release-verification-false-reds.md

# =============================================================================
# BUILD-PLAN REF ROOT (opt-in)
# =============================================================================
# A second root that this repo's build-plan file refs may be written relative
# to, in addition to the repo root. verify-chunk-refs tries the repo root
# first, then this.
#
# Prawduct's plans name plugin files the way the plugin ships them —
# `lib/gates.py`, `skills/backlog/SKILL.md` — because that is how those paths
# read from inside the plugin. They resolve from nowhere at the repo root, so
# without this declaration each one reports as a missing deliverable.
#
# This is DECLARED, never inferred. An earlier cut of the verifier sniffed for
# a `plugin/` directory carrying a plugin manifest and enabled the fallback
# itself; that silently weakens the gate for every repo whose layout happens to
# match — a product shipping a plugin, an extension, or a vendored tree is an
# ordinary layout, not a statement of intent, and a genuinely missing
# deliverable there would resolve against an unrelated directory and never be
# reported. Absent (the default everywhere else) means the repo root is the
# only root.

build_plan_ref_root: plugin

# =============================================================================
# RISK SURFACES
# =============================================================================
# Where a missed defect costs the most. Two consumers read this:
# `prawduct-hook classify-diff-risk` (the review `tier`, telemetry-only today)
# and the Critic's ROSTER derivation — a diff touching one of these gets the
# three-reviewer coordinator at any size.
#
# Declaring the list is what opts this repo into the risk-keyed roster rule.
# Without it, `lib/risk.py`'s framework-shaped *derived defaults* would apply,
# and `_derive_roster` cannot tell "no surface matched, so this is low risk"
# from "this repo never declared any" — so an undeclared repo still escalates on
# the derived defaults and keeps the older file-count rule beneath them, which is
# never less review than before. The values below are exactly
# `risk.DERIVED_DEFAULT_SURFACES`, so declaring them changes no verdict on any
# diff that git can evaluate (see the two exceptions below); it
# makes the opt-in explicit and keeps the 2026-07-30 roster replay describing
# the rule that actually runs here.
#
# Two things declaring DOES change, both deliberate. (1) `classify-diff-risk`
# keys its failure asymmetry on declaration: with surfaces declared and the diff
# unevaluable (git failure) the verdict now fails CLOSED to `escalate`, where an
# undeclared repo failed open to `standard`. That is the safe direction and the
# reason the asymmetry exists. (2) A declared list is EXCLUSIVE, so backticked
# contract paths in artifacts/boundary-patterns.md no longer contribute — today
# that subtracts nothing because the file is still the unfilled template, but
# anyone who fills it must add those paths here too or they will not count.
#
# Both packaging layouts are listed because the evidence store spans the
# `plugin/` restructure (`c6b8131`, 2026-07-21): pre-restructure facts carry
# root-relative paths, and dropping those forms would silently change how
# historical reviews replay.
risk_surfaces:
  - skills/
  - plugin/skills/
  - lib/gates*
  - plugin/lib/gates*
  - bin/*hook*
  - plugin/bin/*hook*

# =============================================================================
# COVERAGE EVIDENCE (opt-in, v1.4+)
# =============================================================================
# When true, the Critic requires every changed file to appear in
# `.test-evidence.json`'s `changes_referenced` list and scales severity
# language to the declared `coverage_level` (`referenced` floor vs.
# `executed` real). See `/prawduct:building` "Coverage Evidence" + the
# reference verifier at `bin/test-reference-verify`. Default off in
# v1.4 — schema is checked but content is not enforced (Chunk 09 ships
# the Critic check). The framework dogfoods the new evidence schema
# regardless (every chunk emits the new fields) so drift surfaces early.

coverage_required: false

# =============================================================================
# OPERATOR VERIFICATION (opt-in, v1.4+)
# =============================================================================
# When true, `/pr create` BLOCKS if `.prawduct/operator-verification.md`
# has any entry with `**Status:** pending`. The framework itself ships
# this gate disabled — Prawduct has no human-facing UI surface to
# verify pre-merge; product repos that ship visual changes opt in by
# setting `operator_verification_required: true`.

operator_verification_required: false

# =============================================================================
# API VERSIONING DECISION (advisory-probe resolution signal)
# =============================================================================
# Flat top-level mirror of design_decisions.api_versioning_approach — the
# api-versioning advisory probe reads only column-0 scalars, so this is its
# readable resolution signal. Truthy = a decision was recorded → suppress the
# nudge. See artifacts/api-contract.md for the full decision.

api_versioning_decided: "plugin-semver + evidence-schema-version; CLI internal, external-consumer versioning deferred (revisit: first non-prawduct caller of prawduct-hook)"

# =============================================================================
# NORM REGISTRY RATIFICATION (advisory-probe resolution signal)
# =============================================================================
# Flat top-level scalar the norm-registry-unratified probe reads (column-0
# scalar). Truthy = the owner ratified the norm registry -> suppress the nudge.
# The ratified norms live in `## Direction` sections across the strategy
# artifacts, indexed in artifacts/project-preferences.md section Enforcement.

norm_registry_ratified: "2026-07-17 — ratified; 26 Direction norms across the 7 strategy artifacts as of 2026-07-30 (architecture 6, data-model 6, security-model 3, observability-strategy 3, nonfunctional-requirements 3, api-contract 3, operational-spec 2); preferences Enforcement index carries the norm columns (Audit home / Why)"

# =============================================================================
# DEPRECATED TERMS
# =============================================================================
# Track vocabulary changes to catch stale references.
# Only terms that could still appear in active files.

deprecated_terms:
  - term: "product shapes"
    replacement: "structural characteristics"
    patterns: ["product shape"]
  - term: "concern dimensions"
    replacement: "structural characteristics"
    patterns: ["concern dimension"]

