# Project State — Prawduct Framework (Self-Hosted)
#
# The framework IS a product in iteration phase. This file tracks its own
# state using the same structure it prescribes for user products.

# Product identity — read by the SessionStart briefing for the project name.
# This repo's state is hand-written and predated the `product_identity` block the
# templates/project-state.yaml scaffold provides; without it the briefing printed
# "Project: Unknown" for the framework itself (Chunk 14).
product_identity:
  name: "Prawduct"

# Backlog format version. v2 = structured items (ID + metadata bar). Consulted
# by the legacy-backlog-format post-sync advisory probe.
backlog_format_version: 2

# THE CUTOVER (API §2.4). Set 2026-08-01 by v3.2.0 Chunk 06, after
# `backlog verify-migration` returned exit 0 with all five conflict lists empty
# (source_items 371 = aliased 371). This single key repoints the session briefing
# to the GV2 snapshot and retires every markdown-premise advisory probe — and
# `backlog-checks-dormant` starts firing at the same switch, so the operator
# learns what went dark rather than discovering it as an unexplained absence.
#
# From here `.prawduct/backlog.md` is FROZEN HISTORY for this repo. It records
# the corpus as it stood at the moment of migration; the tracker is authoritative
# from now on, and the two are expected to diverge (the 42 post-import
# dispositions are applied on the tracker, not backported here).
#
# `lib/backlog/legacy.py` is NOT retired by this flip — not this repo's, not any
# repo's. GV7/MG3 retire it only at portfolio-wide migration, and
# `lib/backlog/migrate.py` reads through `legacy.parse_backlog`, so retiring it
# would disable the next repo's migration.
backlog_service_repo: brookstalley/prawduct

# Last full backlog grooming (stamped by /prawduct:backlog list/pick/groom).
# Timestamp, not a count — counts are always re-derived (D14). Resolves the
# backlog-overdue-grooming advisory.
backlog_last_groomed_at: 2026-08-03

# Distribution model. `plugin` = this repo is governed by the Prawduct plugin
# (v2.0.0), not file-sync. Set in Chunk 13 when the repo cut over to dogfood its
# own plugin. Governance runs via the plugin (`bin/`, `lib/`, `skills/`,
# `methodology/`, `hooks/`); the file-sync engine that the v1 distribution
# shipped (`tools/` + the file-sync templates) was retired in M4 (MIG-M4-REMOVE).
distribution: plugin

# Gitflow base branch (top-level scalar, read by `_resolve_base_branch`). This
# repo cuts feature branches from `develop` and merges back to `develop`
# (develop→main is a periodic release promotion). Without this knob the PR /
# coverage / cumulative-Critic / reviewer gates fall back to `main` and scope a
# feature branch as the entire develop→main promotion delta. `origin/develop` is
# preferred over the bare `develop` for a stable remote-tracking merge-base.
base_branch: develop

# The canonical suite invocation (dogfooding the declared-command posture the
# record on-ramp prescribes — the interpreter fallback is deprecated-by-nudge).
# Stdlib-only repo: the hook's python3 IS the project environment.
test_command: python3 -m pytest tests/ --junit-xml={junit_xml} -q

# =============================================================================
# CLASSIFICATION — structural characteristics (methodology/discovery.md)
# =============================================================================
# Reconciled from this codebase, not a discovery interview (discovery.md §
# Reconciling an Existing Product): prawduct is a mature product, so its six
# structural characteristics are read off what it already is. Recording them is
# load-bearing — the strategy-class artifact coverage chain keys off this block
# (layer 0 clears once >=1 is recorded; each recorded triggering characteristic
# then owes its artifact). Four present, two absent; the two present *triggering*
# characteristics make prawduct owe the full seven strategy-class artifacts.
classification:
  domain: developer-tool
  structural:
    # Present — operators read terminal output: bin/prawduct-hook reports, the
    # SessionStart briefing, advisory/doctor text, the /prawduct:* skills.
    has_human_interface:
      modality: terminal
      platform: cross-platform
    # Present — SessionStart/Stop/UserPromptSubmit/SubagentStop hooks fire on
    # Claude Code lifecycle events, not by human invocation; the pervasive
    # fail-soft design (a probe never blocks session start) is the "design
    # against silent failure" this characteristic implies.
    runs_unattended:
      trigger: event-driven
    # Present — prawduct IS a Claude Code plugin plus a bin/prawduct-hook CLI with
    # --json machine contracts: the harness (external) invokes hooks via
    # settings.json, skills (internal) call the CLI. Triggers api-contract.md.
    exposes_programmatic_interface:
      consumers: both
    # Absent — one actor class (the product owner) plus the AI runtime; no
    # privilege tiers, trust boundaries, or data isolation between party types.
    has_multiple_party_types: null
    # Absent — persisted data is development-process metadata (state, learnings,
    # evidence, findings, backlog); no PII/financial/health/credentials under
    # regulatory obligation. (Universal security-model.md still applies —
    # plugin-trust / supply-chain is a security concern regardless.)
    handles_sensitive_data: null
    # Present — the Critic coordinator fans out parallel critic-reviewer subagents
    # writing partial findings files, then critic-consolidate merges them; the
    # evidence store (evidence.jsonl) is shared and tree-keyed across all
    # worktrees of the clone. Triggers architecture.md.
    multi_process_distributed:
      topology: monolith-with-workers

# =============================================================================
# DEPENDENCY GRAPH
# =============================================================================

dependency_graph:
  - decision_id: principles-plus-structural-gates
    description: "Principles govern how-to-work behaviors; structural gates (hooks) enforce process-interruption behaviors Claude can't self-regulate"
    affects_artifacts: [CLAUDE.md, methodology/, agents/critic/, tools/product-hook]
  - decision_id: product-self-containment
    description: "Product repos carry everything needed to build — own CLAUDE.md, hooks, Critic instructions. No runtime dependency on framework."
    affects_artifacts: [templates/, tools/prawduct-setup.py]
  - decision_id: critic-as-separate-agent
    description: "Critic invoked via Task tool as independent agent, not in main context"
    affects_artifacts: [agents/critic/SKILL.md, .prawduct/critic-review.md]

# =============================================================================
# DESIGN DECISIONS
# =============================================================================
# Recorded decisions for the exposed programmatic interface (the prawduct-hook
# CLI + hook lifecycle). Detailed in artifacts/api-contract.md; mirrored here per
# templates/project-state.yaml. The flat top-level `api_versioning_decided`
# scalar (below, near the opt-in flags) is the advisory-probe resolution signal.

design_decisions:
  api_versioning_approach:
    scheme: "plugin semantic versioning (whole-surface; the auto-update cache key) plus independent evidence-store schema versioning for persisted facts"
    granularity: "whole-surface for the plugin; per-store integer schema version for the evidence store"
    status: active
    rationale: "the CLI subcommand surface is internal — consumed only by skills shipped at the same plugin version — so it needs no per-subcommand version; persisted facts outlive a plugin version, so the evidence store carries its own schema version with schema-ahead (forward-incompat) detection"
    revisit_trigger: "first tool other than prawduct's own skills that is meant to call prawduct-hook — add a documented stability tier and a --version handle before that consumer ships"
    detailed_in: artifacts/api-contract.md
    date: 2026-07-17
  api_error_model_approach:
    scheme: "exit codes are the contract on a documented scheme (harness hook 0=allow/2=block; CLI gate 0=pass/1=fail; state-mutating writer 0=written-or-idempotent-no-op/1=refused-nothing-written; usage error 2; unevaluable advisory gate fails open, unevaluable writer fails closed) plus a stable message-prefix vocabulary (CRITICAL/WARNING/NOTE/BLOCKED)"
    channels: "stdout is agent-facing (composed into model context); stderr is user/diagnostics; no internal stack trace crosses the boundary"
    status: active
    rationale: "exit codes are the stable, allowlist-friendly signal skills bind to; failures are caught, attributed, and turned into an exit code + prefixed note, never raised across the boundary"
    detailed_in: artifacts/api-contract.md
    date: 2026-07-17
  infrastructure_dependencies:
    services:
      - name: "GitHub Issues REST API"
        client: "the `gh` CLI, driven as a subprocess (list-form args, never a shell)"
        scope: "opt-in per product — reached only when `backlog_service_repo` is set; unset means the markdown backend and zero network calls"
        credential: "`gh` owns it (`~/.config/gh`); the adapter never reads, stores, or forwards a token, and redacts token-shaped patterns from all surfaced output (SEC-1)"
        egress_boundary: "three egress sites: lib/backlog/transport.py (opt-in backlog backend); lib/release_verification.py (check-released shells to gh for the Releases page, operator/CI-invoked, added 2026-08-04); and a gh pr list in cmd_stop in bin/prawduct-hook, which DOES run on the Stop hook path. The first two scrub secrets from foreign-CLI stderr before echoing it"
    mock_boundary: "tests/fakes/fake_github.py implements the transport seam for the offline suite"
    integration_test_strategy: "offline suite runs entirely against the fake; the rest of the L5 smoke set queued in build-plan-backlog-service.md stays deferred by owner decision to an owner-run session. The relationship/timeline shapes (`list_blocked_by`, `list_sub_issues`, `list_timeline`) are NO LONGER fake-verified only — VRF-010 ran all three against real GitHub on 2026-07-28 and the fake's shapes matched; the evidence has one home, `.prawduct/operator-verification.md` VRF-010. BKL-3N8Q, cited here by a stable id that must not be renumbered, was reconciled to shipped on that evidence 2026-07-31 and is now an archived item — a weaker pointer than it was, kept because the id is the citation."
    status: active
    rationale: "declared at the backlog-service cutover alongside the architecture.md local-first amendment; recording it re-enables the Critic's infrastructure-coherence and real-dependency checks, which sit dormant while the field is null"
    date: 2026-07-21

