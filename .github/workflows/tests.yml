# Run the suite — on every push, and on every pull request.
#
# Until this file existed, `tests/` ran only when someone remembered to run it.
# Every release this repo ever cut shipped that way. The gap is independent of any
# one release and is the larger half of the problem: a suite nothing invokes is a
# suite that is green by assumption.
#
# **No path filters, deliberately.** The obvious economy here — skip the run when
# only `.md` or `.prawduct/**` changed — reproduces a hole this repo has already
# fallen into: `tests/test_norm_probes.py` reads the live `project-state.yaml`, so
# a docs-and-state change really can turn the suite red. A filter that calls those
# paths untestable would hide exactly that class of break. Runs are cheap; the
# hole is not.
#
# **Action pins are floating majors** (`actions/checkout@v7`, `actions/setup-python@v7`),
# verified to exist on 2026-08-04 rather than recalled: `gh api
# repos/actions/checkout/releases/latest` → v7.0.1, `actions/setup-python` →
# v7.0.0. These are GitHub's own first-party actions, where the major tag is the
# publisher's documented contract and picks up security fixes without a bump. A
# third-party action would be pinned to a SHA instead — the supply-chain exposure
# there is somebody else's account, not GitHub's own org.
#
# **The suite runs on testament's pool when the workflow can use it, and on
# GitHub's runner when it cannot.** `tools/ci-suite.py` decides, in two stages that
# are the two jobs below, and its docstring holds the table. The `pool` job sends the
# tree to the pool: the same image and selection a developer's `testament run` uses,
# so a CI verdict and a developer's are the same kind of fact. The `pytest` job then
# runs the tests `.testament.toml` selects out (they read git history or a clone's
# cache, which a pool runner has neither of). When the pool did not run the suite the
# `pytest` job runs all of it, and that is every pull request from a fork: GitHub
# gives those no secrets, which is also what keeps a stranger's code off the pool's
# machines. A pool that cannot be reached costs a warning and a full run here; a pool
# that refuses the key fails the `pool` job, because nothing else would say that CI
# had stopped using it.
#
# **The key is in a job that runs no test.** `TESTAMENT_KEY` runs code on the pool's
# machines. Keeping it out of pytest's environment would not keep it from a test: a
# process can read its parent's environment, and everything a test imports runs as
# the same user. So the `pool` job holds the key, installs nothing from a package
# index and runs no test, and the `pytest` job, which installs the dev extra and runs
# the tests, references no secret. This workflow never triggers on
# `pull_request_target`, which would hand the `pool` job a fork's code together with
# the key. The pool's two addresses are repository variables rather than text in this
# file; GitHub prints them in the run's log, and the pool's console publishes both.
# `tests/preferences/test_ci_workflow_conventions.py` pins all of it.
#
# **No pytest flags here.** Distribution mode, timeouts and `testpaths`
# all live in `pyproject.toml`, and are deliberately not named here — repeating a
# value makes this a second home for it, and the next person to tune one would
# tune one of the two. (That is not hypothetical: this comment used to spell out
# `-n auto`, and when the worker count was repriced on 2026-08-19 the copy here
# was left behind asserting the retired value.) Same reason the dependency list
# is read out of the `dev` extra rather than restated: `pip install ".[dev]"` is
# a reference to it.
#
# That includes the worker count, which is pinned at 5 for a developer's machine
# and therefore OVERSUBSCRIBES a 4-core runner whenever pytest runs there (a pool
# run takes its parallelism from the pool). Accepted rather than overridden
# here, and named so it is a known state rather than an oversight: an override
# would be a pytest flag in this file, which is what the paragraph above forbids,
# and no CI timing has been measured to justify amending that. If runs start
# timing out under contention, the fix is to make the count environment-driven
# WITH that evidence — not to inline a flag here.

name: tests

on:
  # Unfiltered by branch as well as by path. A branch that never opens a PR is
  # precisely the branch nobody is watching.
  #
  # Weighed and kept: pairing these double-runs the matrix for any branch with an
  # open PR, and the concurrency group below cannot collapse the pair because the
  # two events carry different refs (`refs/heads/<branch>` vs `refs/pull/N/merge`).
  # They test different trees — the branch tip, and the merge result — so the
  # duplication buys a real second answer. What it spends is pool slots for a
  # second run of about a minute; on a public repo the Actions minutes are free.
  push:
  pull_request:

# A superseded run tells you about a commit that no longer exists. Cancel it.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pool:
    # The only job given the key. It checks out the tree, installs the pool's own CLI
    # build, and waits on the pool. Nothing here comes from a package index and no
    # test runs here; `needs.pool.outputs.suite` tells the `pytest` job whether the
    # pool ran the suite ("pool") or left it to that job ("job").
    runs-on: ubuntu-latest
    # The runner gives the pool ten minutes over both of its attempts
    # (`POOL_WAIT_SECONDS`); the rest is checkout, the download and the install.
    timeout-minutes: 15
    outputs:
      suite: ${{ steps.pool.outputs.suite }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The client sends the tree as a commit and walks its objects, and the
          # manifest sends release tags (`[git] tags`): both need the history.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          # What testament's CLI needs, not this project's floor: the two are the
          # same number today and move for different reasons.
          python-version: "3.14"

      - name: Send the suite to the pool
        id: pool
        # An unset secret or variable renders as the empty string, which the runner
        # reads as unset. `github.head_ref` is a fork's to choose, so it travels as
        # an environment value and is never spliced into a command.
        env:
          TESTAMENT_KEY: ${{ secrets.TESTAMENT_KEY }}
          TESTAMENT_COORDINATOR: ${{ vars.TESTAMENT_COORDINATOR }}
          TESTAMENT_CONSOLE: ${{ vars.TESTAMENT_CONSOLE }}
          # A pull request's checkout is its merge commit, not a branch; this is
          # the branch the pool's history files the run under.
          TESTAMENT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: python tools/ci-suite.py pool

  pytest:
    # After `pool`, whatever its result: a failed pool run still owes the tests the
    # pool leaves out, and a refused key still owes the tree a verdict. Skipped only
    # when the run is cancelled.
    needs: pool
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every leg reports: fail-fast would throw away whichever finished second
      # once there is more than one.
      fail-fast: false
      matrix:
        # The floor. It mirrors `requires-python` in `pyproject.toml` — that file
        # is the fact, this is a copy of it, and
        # `tests/preferences/test_ci_workflow_conventions.py` fails if the two
        # drift. When the pool runs the suite, this leg runs only the tests the
        # pool leaves out, so a second leg here would not prove a newer release:
        # that release would have to be the pool image's Python as well.
        #
        # A pool run executes in the pool's image, not on this interpreter, and the
        # same test holds that image (`docker/testament.Dockerfile`) to the floor.
        # This interpreter runs the tests the pool leaves to this job, and the
        # whole suite whenever the pool did not run it.
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          # The suite contains a pin that searches history by content —
          # `test_norm_index_scaffold.py` asks whether a scaffold row was ever
          # actually shipped in the template. A shallow clone answers "never"
          # with a straight face, so the guard fails claiming the row is wrong
          # when the truth is that CI truncated the history it reads.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        # The `dev` extra is the one home for these; see the header. The install
        # carries the dependency list only — `packages = []`, and the tests reach
        # `plugin/` through `tests/conftest.py`'s path shim, not through site-packages.
        #
        # **Known open: the build backend re-resolves on every run (#609).** Reading
        # the extra makes pip build this project's metadata, and it does that in an
        # ISOLATED environment that installs `[build-system] requires` fresh from the
        # index. No constraints mechanism reaches inside it — verified empirically,
        # not assumed: `setuptools==60.0.0` pinned deliberately below the declared
        # `>=61` floor was ignored via both `-c` and `PIP_CONSTRAINT`, and the build
        # env fetched the newest release regardless. So setuptools' build-time code
        # executes on every CI run and every contributor's machine, at whatever
        # version shipped that day.
        #
        # Not closed here, and the reason is a sequencing one rather than a judgment
        # one: the fix is `--no-build-isolation` with setuptools pinned in
        # `constraints.txt`, and `constraints.txt` — the whole `-c` posture for the
        # rest of the extra — lives on the unmerged `feature/upstream-dependency-policy`
        # branch. Landing half of it here would create a constraints file whose
        # contents contradict that branch's, and pinning a setuptools version that
        # cannot be resolved or tested from this tree would gate every CI run on a
        # guess. Named so it is a known state rather than an oversight.
        run: python -m pip install ".[dev]"

      - name: Run the tests this job owes
        # What the pool left out when it ran the suite, the whole suite when it did
        # not. Any word but "pool", an empty one included, means the whole suite.
        env:
          CI_SUITE_RAN_ON: ${{ needs.pool.outputs.suite }}
        run: python tools/ci-suite.py tests

  collector:
    # The stats collector (`collector/`) is a Cloudflare Worker with no
    # dependencies; its suite runs on node's built-in test runner, each file in
    # its own process. Pinned to the Active LTS; the suite was verified on 22,
    # 24 and 25.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run the collector suite
        run: node --test 'collector/test/*.test.mjs'
