# How Testament (`testament run`) runs this repo's pytest suite on its pool. Machine-specific
# settings (the coordinator's address, this machine's key) live in ~/.config/testament, never here.
#
# The suite is the one CI runs (`.github/workflows/tests.yml`: `python -m pytest`, testpaths and
# options from pyproject's [tool.pytest.ini_options]). On a runner Testament forces `-n 0`, so the
# `-n`/`--dist` in addopts apply only to local runs; the pool is the parallelism. The collector's
# node suite is not pytest and stays with `prawduct-hook test-evidence record`.
#
# No lockfile: `uv.lock` is gitignored here (dependencies resolve fresh per environment, as CI's
# `pip install ".[dev]"` does), so setup resolves the `dev` extra and the command runs `--no-sync`.
#
# A runner's checkout has the tree but no history and no backlog cache, so tests marked
# `requires_history` or `requires_local_cache` are selected out here; the evidence recorder runs
# exactly those locally (`test_commands` in `.prawduct/project-state.yaml`), and a plain `pytest`
# run and CI still run them.
# Release tags do reach runners ([git] below), as trees, which is all the tag-reading tests use.
manifest_version = 2
name = "prawduct"
executor = "container"
command = ["uv", "run", "--no-sync", "python", "-m", "pytest", "-m", "not requires_history and not requires_local_cache"]
default_selection = ["tests/"]
env_inputs = ["pyproject.toml"]

[env]
UV_CACHE_DIR = "/tr/cache/uv"

[image]
dockerfile = "docker/testament.Dockerfile"
inputs = ["docker/testament.Dockerfile"]

[git]
tags = ["v[0-9]*"]

[setup]
steps = [["uv", "sync", "--extra", "dev", "--quiet"]]
