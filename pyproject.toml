[project]
name = "prawduct"
# Vestigial packaging metadata (the repo is not PyPI-published). The canonical
# plugin version is VERSION / .claude-plugin/plugin.json; keep this in step on release.
version = "3.3.5-dev"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3",
    "pyyaml>=6.0",
]

# The dev extra above is the only home for the test dependencies, and a CI job
# that re-listed them would be a second one. `pip install ".[dev]"` is how CI
# reads it — which means this repo has to be *installable*, and until this stanza
# existed it was not: setuptools' flat-layout discovery finds `plugin/` beside
# other top-level directories and refuses to guess. Nothing is packaged
# (`packages = []`) because nothing here is importable-as-installed — tests reach
# `plugin/` through `tests/conftest.py`'s path shim. The install exists to carry
# the dependency list, not the code.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# Worker count is pinned rather than `auto` (owner request 2026-08-19): `auto`
# takes every core, and a full-suite run then owns the developer's machine for
# its whole duration — measured at a load average of 24 on a 10-core box with
# a suite run in flight. CI is unaffected in practice: GitHub's standard
# runners have 4 cores, so `auto` was already giving it fewer than this.
addopts = [
    "-n", "5",
    "--dist", "loadfile",
    "--timeout", "30",
    "--timeout-method", "thread",
]
