[project]
name = "prawduct"
# Vestigial packaging metadata (the repo is not PyPI-published). The canonical
# plugin version is VERSION / .claude-plugin/plugin.json; keep this in step on release.
version = "2.0.14"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-n", "auto",
    "--dist", "loadfile",
    "--timeout", "30",
    "--timeout-method", "thread",
]
