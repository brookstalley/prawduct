[project]
name = "prawduct"
# Vestigial packaging metadata (the repo is not PyPI-published). The canonical
# plugin version is VERSION / .claude-plugin/plugin.json; keep this in step on release.
version = "3.2.6"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3",
    "pyyaml>=6.0",
]

# The dev extra above is the only home for WHICH test dependencies this repo has,
# and a CI job that re-listed them would be a second one. It is deliberately not the
# home for WHICH VERSIONS are installed: the floors above say what is supported, and
# `constraints.txt` records the one resolution that is authoritative (clause 5 of
# `plugin/docs/upstream-dependency-policy.md`). Adding a package here without pinning
# it there leaves it free to re-resolve on every run — `tests/preferences/
# test_dependency_resolution_pinning.py` is what makes that a red test rather than a
# silent hole.
#
# `pip install -c constraints.txt ".[dev]"` is how CI reads both — which means this
# repo has to be *installable*, and until this stanza
# existed it was not: setuptools' flat-layout discovery finds `plugin/` beside
# other top-level directories and refuses to guess. Nothing is packaged
# (`packages = []`) because nothing here is importable-as-installed — tests reach
# `plugin/` through `tests/conftest.py`'s path shim. The install exists to carry
# the dependency list, not the code.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-n", "auto",
    "--dist", "loadfile",
    "--timeout", "30",
    "--timeout-method", "thread",
]
